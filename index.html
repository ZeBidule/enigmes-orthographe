<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b2412">
<title>Plume &amp; Cie : L'Affaire du Manuscrit Perdu</title>
<style>
  :root{--parch:#f4e4bc;--ink:#3b2412;--accent:#8b2e16;--gold:#c99a2e;--ok:#2e7d32;--ko:#b3261e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:var(--ink);
    background:radial-gradient(circle at 50% 0,#6b4a2b,#2a1a0e);display:flex;justify-content:center}
  #app{width:100%;max-width:680px;padding:10px}
  header{display:flex;justify-content:space-between;align-items:center;color:var(--parch);padding:6px 4px;gap:8px}
  header h1{font-size:1.05rem;margin:0}
  .money{background:var(--gold);color:#2a1a0e;border-radius:20px;padding:4px 12px;font-weight:bold;white-space:nowrap}
  .card{background:var(--parch);border-radius:14px;padding:16px;box-shadow:0 8px 24px #0008;border:3px solid #a67c3d;margin-bottom:12px}
  .card h2{margin:0 0 4px;color:var(--accent);font-size:1.3rem}
  .meta{font-size:.85rem;opacity:.8;margin-bottom:10px}
  .scene svg{width:100%;height:auto;border-radius:10px;border:3px solid #a67c3d;display:block}
  .story{display:flex;gap:10px;align-items:center;font-style:italic;background:#fff6dc;border-left:4px solid var(--gold);padding:8px;border-radius:6px;margin-bottom:12px;line-height:1.45}
  .story svg{width:56px;flex:none}
  .letter{background:#fffaf0;padding:14px;border-radius:8px;line-height:2.1;font-size:1.1rem;border:1px dashed #a67c3d}
  .w{cursor:pointer;padding:2px 3px;border-radius:4px;user-select:none}
  .w:hover{background:#f0d98a}
  .w.sel{background:var(--accent);color:#fff}
  .blank{display:inline-block;min-width:60px;border-bottom:2px solid var(--accent);text-align:center;font-weight:bold;color:var(--accent);cursor:pointer;padding:0 4px;line-height:1.6}
  .blank.active{background:#f0d98a}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
  input.answer{font:inherit;font-size:1.2rem;padding:10px;border-radius:8px;border:2px solid var(--accent);width:100%;margin-top:12px;background:#fff}
  .accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
  .accents button{min-width:42px;padding:8px}
  button{font-family:inherit;font-size:1rem;border:none;border-radius:10px;padding:11px 15px;cursor:pointer;
    background:var(--accent);color:#fff;box-shadow:0 3px 0 #5a1d0e;min-height:44px}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #5a1d0e}
  button.alt{background:#6b4a2b;box-shadow:0 3px 0 #3b2412}
  button.gold{background:var(--gold);color:#2a1a0e;box-shadow:0 3px 0 #8a6a1e}
  button:disabled{opacity:.45;cursor:default}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:space-between}
  .hint{margin-top:10px;background:#e8f0ff;border-radius:8px;padding:10px;font-size:.95rem}
  .overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay .card{max-width:520px;width:100%;text-align:center;max-height:90vh;overflow:auto}
  .big{font-size:2.4rem;font-weight:bold;margin:6px 0}
  .big.ok{color:var(--ok)} .big.ko{color:var(--ko)}
  .rule{text-align:left;background:#fff6dc;border-radius:8px;padding:10px;margin-top:10px;font-size:.95rem;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
  .grid button{padding:8px 0;font-size:.95rem}
  .chap{margin:12px 0 6px;font-weight:bold;color:var(--accent)}
  .shop-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #d9c08a;gap:8px}
  .progress{height:10px;background:#d9c08a;border-radius:6px;overflow:hidden;margin:8px 0}
  .progress div{height:100%;background:var(--ok)}
  .center{text-align:center}
  .title-screen{min-height:95vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 0}
  .title-logo .t1{font-size:clamp(2.6rem,11vw,4.2rem);font-weight:bold;color:var(--gold);letter-spacing:2px;
    text-shadow:0 3px 0 #5a1d0e,0 6px 18px #000;font-variant:small-caps}
  .title-logo .t2{font-size:clamp(1.05rem,4.5vw,1.5rem);color:var(--parch);font-style:italic;margin-top:4px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:4px 10px;display:inline-block}
  .title-prof{width:150px;background:radial-gradient(circle,#f4e4bc55,transparent 70%);animation:bob 3s ease-in-out infinite}
  .title-prof svg{width:100%}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .title-pitch{color:var(--parch);line-height:1.5;max-width:420px;margin:0}
  .title-buttons{display:flex;flex-direction:column;gap:10px;width:min(320px,90%)}
  .title-buttons button{font-size:1.15rem;padding:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--parch);padding:12px 18px;border-radius:10px;z-index:20;box-shadow:0 4px 12px #0008}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/puzzles.js"></script>
<script src="js/shop.js"></script>
<script src="js/game.js"></script>
</body>
</html>
